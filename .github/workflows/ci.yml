name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  # A version identifies a release, not a change. Bumping per commit produced six versions in
  # two hours, three never published, with the file, the tag, and the registry all disagreeing.
  # The convention alone did not hold — CLAUDE.md used to ask for a per-change bump — so it is
  # enforced here. Release bumps happen on main via `npm version` (see CONTRIBUTING).
  version-guard:
    name: Version untouched (release bumps happen on main)
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Fail if this PR changes the version
        env:
          BASE: ${{ github.base_ref }}
        run: |
          git fetch --depth=1 origin "$BASE"
          base_pkg=$(git show FETCH_HEAD:package.json | jq -r .version)
          base_file=$(git show FETCH_HEAD:VERSION | tr -d '[:space:]')
          head_pkg=$(jq -r .version package.json)
          head_file=$(tr -d '[:space:]' < VERSION)

          rc=0
          if [ "$base_pkg" != "$head_pkg" ]; then
            echo "::error file=package.json::version changed in a PR ($base_pkg -> $head_pkg). Revert it; release from $BASE with 'npm version patch'."
            rc=1
          fi
          if [ "$base_file" != "$head_file" ]; then
            echo "::error file=VERSION::VERSION changed in a PR ($base_file -> $head_file). Revert it; 'npm version' writes this file for you."
            rc=1
          fi
          # Parity is enforced at publish time too, but catch a half-edit here with a clearer message.
          if [ "$head_pkg" != "$head_file" ]; then
            echo "::error::package.json ($head_pkg) and VERSION ($head_file) disagree. Run 'node scripts/sync-version.mjs'."
            rc=1
          fi
          [ $rc -eq 0 ] && echo "version untouched at $head_pkg"
          exit $rc

  kit:
    name: Kit (validate + render + init)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22   # concurrently@10 requires >=22; also pins which npm validates the lockfile

      - name: Validate the example board
        run: node scripts/validate-board.mjs board/data.json

      # The suite pins the install path's guarantees (no lifecycle hooks, npm ci not
      # npm install, checksum-free vendoring) and the cockpit's exposure controls. It was
      # not running in CI at all, so those guarantees were only ever checked by hand.
      - name: Unit tests
        run: npm test

      - name: Render a starter and check for drift
        run: |
          rm -rf /tmp/proj && mkdir -p /tmp/proj
          cp -R starters/orchestrated-project/. /tmp/proj/
          node render/sync.mjs --project /tmp/proj --kit .
          node render/sync.mjs --project /tmp/proj --kit . --check
          node scripts/validate-board.mjs /tmp/proj/board/data.json --agents ./agents

      - name: setup smoke test (clone-into-project flow)
        run: |
          rm -rf /tmp/app && mkdir -p /tmp/app/src
          rsync -a --exclude .git --exclude node_modules ./ /tmp/app/maestro/
          # --no-board: `setup --yes` would otherwise start the blocking board dev server
          # (this hung the job for 6h once; the CLI also refuses to launch it without a TTY).
          node /tmp/app/maestro/bin/cli.mjs setup --yes --no-board --name ci-app --areas backend,web \
            --outcome "An internal reporting API." --users "Ops analysts." \
            --stack "Node + Postgres" --constraints "No prod access from dev." \
            --run "npm run dev" --test "npm test"
          test -d /tmp/app/.claude/agents      # rendered to the repo root, not into maestro/
          test -f /tmp/app/CLAUDE.md
          test ! -d /tmp/app/maestro/.claude   # must NOT render inside the kit folder
          test -d /tmp/app/.git                # setup initializes a repo (tickets run in worktrees)
          # The brief is written from the answers, and an exact command is rendered as one.
          grep -q "An internal reporting API." /tmp/app/maestro/context.md
          grep -q '| backend | `npm test` |' /tmp/app/maestro/context.md
          ! grep -q "Open questions" /tmp/app/maestro/context.md  # nothing left unanswered

      - name: setup smoke test (unanswered brief becomes open questions)
        run: |
          rm -rf /tmp/app2 && mkdir -p /tmp/app2
          rsync -a --exclude .git --exclude node_modules ./ /tmp/app2/maestro/
          node /tmp/app2/maestro/bin/cli.mjs setup --yes --no-board --name ci-app2 --areas backend
          # Every skipped answer is recorded as an open question rather than a silent blank.
          grep -q "## Open questions" /tmp/app2/maestro/context.md
          grep -q "\*\*Product outcome\*\*" /tmp/app2/maestro/context.md
          # The /project-plan and /orchestrator entry points must land at the repo root, where
          # the coding tool picks them up as slash commands.
          test -f /tmp/app2/.claude/skills/project-plan/SKILL.md
          test -f /tmp/app2/.claude/skills/orchestrator/SKILL.md
          test -f /tmp/app2/.claude/agents/orchestrator.md   # the agent that holds the loop

      - name: init smoke test (separate-capsule flow)
        run: |
          rm -rf /tmp/repo && mkdir -p /tmp/repo
          node bin/cli.mjs init --dir /tmp/repo --name ci-app --areas backend,web --yes

  cockpit:
    name: Cockpit (typecheck + build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22   # concurrently@10 requires >=22; also pins which npm validates the lockfile
      # Dogfoods the real installer rather than a second, looser copy of it: `npm install
      # --no-audit` here would re-resolve ranges and quietly diverge from the lockfile the
      # product installs from.
      - name: Install cockpit deps
        run: npm run cockpit:install
      - name: Type-check (UI + server) and build
        run: |
          npm --prefix cockpit run typecheck
          npm --prefix cockpit run build

      # The server tests need cockpit deps present, so run them here rather than in the
      # kit job, where they would silently skip.
      - name: Cockpit server tests
        run: npm test
